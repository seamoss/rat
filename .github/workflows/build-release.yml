name: build-release

# Fires when release-please (or a human) publishes a GitHub Release. Builds
# rat + rat-daemon for each supported target and uploads the tarballs as
# release assets. Kept in its own workflow so CI runs on every push but the
# cross-platform matrix only runs when there's actually something to ship.

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  upload:
    name: upload · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: rat,rat-daemon
          target: ${{ matrix.target }}
          tar: unix
          archive: $bin-$tag-$target
          token: ${{ secrets.GITHUB_TOKEN }}
